name: aml-variant-demo
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - openjdk=17
  - nextflow>=23.10
  - samtools>=1.19
  - bcftools>=1.19
  - htslib>=1.19
  - bedtools>=2.31
  - gatk4>=4.5
  - kallisto=0.48
  - pizzly>=0.37.3
  - sra-tools>=3.0
  - google-cloud-sdk
  - pandas>=2.0
  # PyPI has no getitd distribution; Bioconda currently supplies this package.
  - getitd=1.5.17
  - pip
